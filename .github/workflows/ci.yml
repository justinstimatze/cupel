name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd)"
          test -z "$unformatted" || { echo "gofmt needed on:"; echo "$unformatted"; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./...
      - name: db-sync
        run: go run ./cmd/cupel db-sync
      - name: db-lint
        run: go run ./cmd/cupel db-lint
      - name: works-lint
        run: go run ./cmd/cupel works-lint
      - name: clusters-lint
        run: go run ./cmd/cupel clusters-lint
      - name: glossary-lint
        run: go run ./cmd/cupel glossary-lint
      - name: tag-audit
        run: go run ./cmd/cupel tag-audit
      - name: quotes-audit
        run: go run ./cmd/cupel quotes-audit
      - name: notebook-leak-audit
        run: ./scripts/notebook-leak-audit --quiet
